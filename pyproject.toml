[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "polars-kir-hmm"
version = "0.1.0"
description = "Polars expression plugin for KIR profile-HMM chain typing, reproducing histo_kir_hmm's outputs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Thorpe", email = "drchristhorpe@googlemail.com" }]
keywords = [
    "polars",
    "bioinformatics",
    "kir",
    "nk-cell",
    "immunology",
    "hmm",
    "profile-hmm",
    "viterbi",
    "classification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = ["polars>=1.0"]

[project.urls]
Homepage = "https://github.com/drchristhorpe/polars_kir_hmm"
Repository = "https://github.com/drchristhorpe/polars_kir_hmm"

[tool.maturin]
python-source = "python"
module-name = "polars_kir_hmm._internal"
features = ["pyo3/extension-module"]
include = [{ path = "python/polars_kir_hmm/models/**/*", format = ["sdist", "wheel"] }]
strip = true

[dependency-groups]
dev = [
    # The parity suite compares against the real histo_kir_hmm, which requires >=3.12 (numba),
    # while this package's abi3 floor is 3.10. The tests skip parity when it is absent.
    "histo-kir-hmm; python_version >= '3.12'",
    "numpy>=2.0; python_version >= '3.12'",
    "scipy>=1.11; python_version >= '3.12'",
    "pytest>=8",
    "maturin>=1.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes tens of seconds because it scores the full IPD-KIR allele set or a construct scan",
]
